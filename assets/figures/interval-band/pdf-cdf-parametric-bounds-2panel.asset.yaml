id: pdf-cdf-parametric-bounds-2panel
family: interval-band
subtype: two-panel-distribution-envelope
status: approved
files:
  preview: pdf-cdf-parametric-bounds-2panel.png
  script: pdf-cdf-parametric-bounds-2panel.py
  fixtures:
  - pdf-cdf-parametric-bounds-2panel.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 3672
  - 3780
  additional-master-formats: forbidden
scene:
- Show an estimated distribution with parametric bounds
- Inspect upper-tail CDF behavior at an expanded scale
data_contract:
  analytical-calculation: forbidden
  summary: Long data with two panels, three ordered curves per panel, and shared x values within each panel.
  required_data_roles:
  - field: panel
    source: pdf-cdf-parametric-bounds-2panel.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: x
    source: pdf-cdf-parametric-bounds-2panel.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: series
    source: pdf-cdf-parametric-bounds-2panel.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: series_order
    source: pdf-cdf-parametric-bounds-2panel.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: value
    source: pdf-cdf-parametric-bounds-2panel.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied estimate and interval per key
    mark_to_data_mapping: the center line or mark encodes the estimate; boundaries encode separately supplied uncertainty
      limits
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - line
  - two-panel
  - vertical-stack
  - envelope-bounds
  encoding:
  - solid-center
  - dotted-bounds
  - grayscale-safe
  annotation:
  - panel-titles
  - separate-legends
  axes:
  - panel-specific-x
  - panel-specific-y
  - horizontal-grid
  layout:
  - stacked-distribution-panels
implementation:
  entrypoint: render
  hard-checks:
  - exactly two panels
  - exactly three ordered curves per panel
  - shared x values within panel
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Curve labels must preserve the supplied bound definitions; do not infer ordering from percentile names.
qa:
  deterministic: true
