id: irf-shaded-ci-2x3
family: interval-band
subtype: six-panel-impulse-response
status: approved
files:
  preview: irf-shaded-ci-2x3.png
  script: irf-shaded-ci-2x3.py
  fixtures:
  - irf-shaded-ci-2x3.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4074
  - 3918
  additional-master-formats: forbidden
scene:
- Compare impulse responses across three measures and two specifications
- Show uncertainty decay over a common horizon
data_contract:
  analytical-calculation: forbidden
  summary: Long data with six ordered panels, shared month horizons, estimates, and supplied lower and upper bounds.
  uncertainty: Supplied 95 percent confidence intervals.
  required_data_roles:
  - field: panel
    source: irf-shaded-ci-2x3.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: panel_order
    source: irf-shaded-ci-2x3.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: month
    source: irf-shaded-ci-2x3.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: estimate
    source: irf-shaded-ci-2x3.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: lower
    source: irf-shaded-ci-2x3.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: upper
    source: irf-shaded-ci-2x3.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  semantic_contract:
    unit_of_observation: one supplied estimate and interval per key
    mark_to_data_mapping: the center line or mark encodes the estimate; boundaries encode separately supplied uncertainty
      limits
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - line
  - interval-band
  - six-panel
  - two-by-three
  encoding:
  - dark-solid-response
  - gray-shaded-interval
  annotation:
  - zero-lines
  - panel-titles
  axes:
  - month-horizon-x
  - shared-y-range
  - full-spines
  layout:
  - two-by-three-small-multiples
implementation:
  entrypoint: render
  hard-checks:
  - six panels ordered one through six
  - unique panel month keys
  - one-to-one panel order mapping
  - shared horizons
  - lower estimate upper interval order
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Row meaning must be supplied in surrounding notes because page-level subfigure text is excluded from the asset.
qa:
  deterministic: true
