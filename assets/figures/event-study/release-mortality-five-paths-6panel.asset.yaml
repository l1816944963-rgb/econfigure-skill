id: release-mortality-five-paths-6panel
family: event-study
subtype: six-panel-independent-boundaries
status: approved
files:
  preview: release-mortality-five-paths-6panel.png
  script: release-mortality-five-paths-6panel.py
  fixtures:
  - release-mortality-five-paths-6panel.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 5700
  - 7194
scene:
- Compare mortality response paths and two supplied boundary pairs across outcomes.
data_contract:
  analytical-calculation: forbidden
  summary: External plotting fixture; no analytical calculation.
  required_data_roles:
  - field: panel
    source: release-mortality-five-paths-6panel.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: x
    source: release-mortality-five-paths-6panel.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: estimate
    source: release-mortality-five-paths-6panel.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: low
    source: release-mortality-five-paths-6panel.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: high
    source: release-mortality-five-paths-6panel.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  - field: outer_low
    source: release-mortality-five-paths-6panel.fixture.csv
    role: input-value
    value_type: number-or-string
    required: true
    description: Supplies a required value used by this asset.
  - field: outer_high
    source: release-mortality-five-paths-6panel.fixture.csv
    role: input-value
    value_type: number-or-string
    required: true
    description: Supplies a required value used by this asset.
  semantic_contract:
    unit_of_observation: one supplied event-time estimate and interval per series and panel
    mark_to_data_mapping: event time encodes distance from the event; estimates and interval bounds are supplied, not calculated
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - six-facets
  - center-path
  - inner-dashed-boundaries
  - outer-dashed-boundaries
  encoding:
  - gray-line
  - two-dash-weights
implementation:
  entrypoint: render
  shared-module: chartlib.inference_renderers
  tick-policy:
    x: centered
    y: centered
compatibility:
  warnings:
  - Store every boundary independently at half-year resolution; raster geometry cannot establish the boundary confidence levels.
  grayscale: preview-generated; review color-dependent distinctions before grayscale use
qa:
  deterministic: true
