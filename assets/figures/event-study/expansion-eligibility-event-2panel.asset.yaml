id: expansion-eligibility-event-2panel
family: event-study
subtype: two-panel-event-study
status: approved
files:
  preview: expansion-eligibility-event-2panel.png
  script: expansion-eligibility-event-2panel.py
  fixtures:
  - expansion-eligibility-event-2panel.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4440
  - 6594
scene:
- Compare actual and simulated eligibility effects around expansion.
data_contract:
  analytical-calculation: forbidden
  summary: External plotting fixture; no analytical calculation.
  required_data_roles:
  - field: panel
    source: expansion-eligibility-event-2panel.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: x
    source: expansion-eligibility-event-2panel.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: estimate
    source: expansion-eligibility-event-2panel.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: low
    source: expansion-eligibility-event-2panel.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: high
    source: expansion-eligibility-event-2panel.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  semantic_contract:
    unit_of_observation: one supplied event-time estimate and interval per series and panel
    mark_to_data_mapping: event time encodes distance from the event; estimates and interval bounds are supplied, not calculated
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - event-point-interval
  - two-vertical-panels
  - reference-period
  - between-period-event-divider
  encoding:
  - black-point
  - black-interval
implementation:
  entrypoint: render
  shared-module: chartlib.inference_renderers
  tick-policy:
    x: centered
    y: centered
compatibility:
  warnings:
  - Preserve the zero reference observation at -1 separately from the event divider at -0.5; do not invent uncertainty for
    a normalized reference.
  grayscale: preview-generated; review color-dependent distinctions before grayscale use
qa:
  deterministic: true
