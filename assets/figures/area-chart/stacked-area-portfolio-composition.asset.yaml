id: stacked-area-portfolio-composition
family: area-chart
subtype: normalized-seven-component-portfolio-profile
status: approved
files:
  preview: stacked-area-portfolio-composition.png
  script: stacked-area-portfolio-composition.py
  fixtures:
  - stacked-area-portfolio-composition.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 5040
  - 3864
  additional-master-formats: forbidden
scene:
- Compare changes in portfolio composition over time
- Show simultaneous growth and contraction across seven asset classes
data_contract:
  analytical-calculation: forbidden
  summary: Continuous years 2011 through 2015 with seven non-negative complete shares summing to 100 in every year.
  required_data_roles:
  - field: year
    source: stacked-area-portfolio-composition.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: component
    source: stacked-area-portfolio-composition.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: component_order
    source: stacked-area-portfolio-composition.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: share
    source: stacked-area-portfolio-composition.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied component value per ordered position
    mark_to_data_mapping: stacked vertical thickness encodes component magnitude or share
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Validate the declared denominator and require each displayed whole to sum to 100% within tolerance.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - stacked-area
  - normalized
  - seven-components
  - annual
  encoding:
  - seven-color-fill
  - dark-boundaries
  annotation:
  - two-row-bottom-legend
  axes:
  - percent-y
  - continuous-year-x
  - tickless-labeled-axes
  layout:
  - single-panel
  - wide-landscape
  - external-bottom-legend
implementation:
  entrypoint: render
  hard-checks:
  - continuous years 2011 through 2015
  - exactly seven components
  - unique year component keys
  - non-negative shares
  - pointwise shares sum to 100
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Seven colors require redundant patterns or a reduced palette when adapted for grayscale thesis printing.
qa:
  deterministic: true
