id: stacked-area-national-assets
family: area-chart
subtype: grayscale-five-component-historical-stack
status: approved
files:
  preview: stacked-area-national-assets.png
  script: stacked-area-national-assets.py
  fixtures:
  - stacked-area-national-assets.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4320
  - 2735
  additional-master-formats: forbidden
scene:
- Show how the composition and total scale of national assets change over time
- Preserve a historically disappearing component with hatch encoding
data_contract:
  analytical-calculation: forbidden
  summary: Eleven ordered observations with five complete non-negative components and an explicit stack order.
  required_data_roles:
  - field: year
    source: stacked-area-national-assets.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: year_order
    source: stacked-area-national-assets.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: component
    source: stacked-area-national-assets.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: component_order
    source: stacked-area-national-assets.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: value
    source: stacked-area-national-assets.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied component value per ordered position
    mark_to_data_mapping: stacked vertical thickness encodes component magnitude or share
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - stacked-area
  - five-components
  - historical-profile
  encoding:
  - black
  - diagonal-hatch
  - light-gray
  - medium-gray
  - white-outline
  - grayscale-safe
  annotation:
  - large-inset-legend
  axes:
  - categorical-year-spacing
  - percent-of-national-income-y
  - tickless-labeled-axes
  - two-direction-grid
  layout:
  - single-panel
  - wide-landscape
implementation:
  entrypoint: render
  hard-checks:
  - exactly five complete components
  - unique year component keys
  - strictly ordered observations
  - non-negative values
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - The equal visual spacing between irregular historical years must be preserved unless a real-use design explicitly requests
    elapsed-time spacing.
qa:
  deterministic: true
