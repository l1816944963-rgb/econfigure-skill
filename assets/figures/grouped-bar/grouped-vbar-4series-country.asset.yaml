id: grouped-vbar-4series-country
family: grouped-bar
subtype: four-series-country-comparison
status: approved
files:
  preview: grouped-vbar-4series-country.png
  script: grouped-vbar-4series-country.py
  fixtures:
  - grouped-vbar-4series-country.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 6402
  - 3030
  additional-master-formats: forbidden
scene:
- Compare four exposure definitions across countries
- Identify cross-country differences in detection rates
data_contract:
  analytical-calculation: forbidden
  summary: Eight ordered countries with four complete non-negative series per country.
  required_data_roles:
  - field: country
    source: grouped-vbar-4series-country.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: country_order
    source: grouped-vbar-4series-country.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: series
    source: grouped-vbar-4series-country.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: series_order
    source: grouped-vbar-4series-country.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: value
    source: grouped-vbar-4series-country.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied value per category-series pair
    mark_to_data_mapping: adjacent bars encode series values within a shared category
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - vertical-bar
  - grouped
  - four-series
  - eight-categories
  encoding:
  - four-pastel-colors
  - dark-outlines
  annotation:
  - legend-outside-right
  axes:
  - zero-baseline
  - percent-y
  - horizontal-grid
  layout:
  - wide-landscape
  - external-legend-margin
implementation:
  entrypoint: render
  hard-checks:
  - exactly four complete series
  - unique country series keys
  - non-negative values
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Four pastel fills are not sufficient alone for grayscale printing and require hatch substitution in real use.
qa:
  deterministic: true
