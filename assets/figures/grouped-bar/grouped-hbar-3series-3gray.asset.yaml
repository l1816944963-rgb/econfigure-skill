id: grouped-hbar-3series-3gray
family: grouped-bar
subtype: seven-category-three-series-grayscale-comparison
status: approved
files:
  preview: grouped-hbar-3series-3gray.png
  script: grouped-hbar-3series-3gray.py
  fixtures:
  - grouped-hbar-3series-3gray.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4308
  - 2070
  additional-master-formats: forbidden
scene:
- Compare three outcomes across treatment conditions
- Separate two experimental regimes
data_contract:
  analytical-calculation: forbidden
  summary: Ordered categories with exactly three non-negative series each.
  required_data_roles:
  - field: order
    source: grouped-hbar-3series-3gray.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: section
    source: grouped-hbar-3series-3gray.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: category
    source: grouped-hbar-3series-3gray.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: series
    source: grouped-hbar-3series-3gray.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: value
    source: grouped-hbar-3series-3gray.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied value per category-series pair
    mark_to_data_mapping: adjacent bars encode series values within a shared category
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - vertical-grouped-bars
  - section-divider
  encoding:
  - dark-gray
  - mid-gray
  - white-outline
  annotation:
  - top-right-legend
  - section-labels
  axes:
  - zero-baseline
  - categorical-x
  layout:
  - single-panel
implementation:
  entrypoint: render
  hard-checks:
  - zero-baseline
  - exactly-three-series
  - at-least-six-cells
compatibility:
  grayscale: preview-generated; semantic color mapping still requires review
  academic-publication: conditional
  warnings:
  - Long category labels require a separate lower band.
qa:
  deterministic: true
