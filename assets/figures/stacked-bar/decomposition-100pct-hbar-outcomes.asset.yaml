id: decomposition-100pct-hbar-outcomes
family: stacked-bar
subtype: outcome-factor-horizontal-decomposition
status: approved
files:
  preview: decomposition-100pct-hbar-outcomes.png
  script: decomposition-100pct-hbar-outcomes.py
  fixtures:
  - decomposition-100pct-hbar-outcomes.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 3840
  - 2160
  additional-master-formats: forbidden
scene:
- Compare factor contributions across many outcomes
- Show dominant and residual components with supplied edge statistics
data_contract:
  analytical-calculation: forbidden
  summary: Eleven ordered outcomes with four non-negative shares summing to one and two supplied edge labels per outcome.
  required_data_roles:
  - field: outcome
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: outcome_order
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: component
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: component_order
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: share
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  - field: left_label
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  - field: right_label
    source: decomposition-100pct-hbar-outcomes.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  semantic_contract:
    unit_of_observation: one supplied component value per bar
    mark_to_data_mapping: segment size encodes a component; normalized assets require components to sum to the declared whole
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Validate the declared denominator and require each displayed whole to sum to 100% within tolerance.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - horizontal-bar
  - normalized-stack
  - eleven-outcomes
  encoding:
  - red-marker-fill
  - blue-lines
  - green-crosshatch
  - gray-dot-hatch
  - redundant-pattern
  annotation:
  - outcome-statistics
  - bar-edge-labels
  - bottom-boxed-legend
  axes:
  - percent-x
  - long-outcome-y
  layout:
  - wide-left-label-margin
  - compact-landscape
implementation:
  entrypoint: render
  hard-checks:
  - unique outcome component keys
  - non-negative shares
  - rows sum to one
  - supplied annotation fields
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Dense outcome text and coefficient labels require source-size and insertion-size review.
qa:
  deterministic: true
