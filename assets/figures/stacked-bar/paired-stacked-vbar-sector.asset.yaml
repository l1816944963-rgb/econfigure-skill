id: paired-stacked-vbar-sector
family: stacked-bar
subtype: paired-sample-stacked-annual-bars
status: approved
files:
  preview: paired-stacked-vbar-sector.png
  script: paired-stacked-vbar-sector.py
  fixtures:
  - paired-stacked-vbar-sector.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4710
  - 2316
  additional-master-formats: forbidden
scene:
- Compare two samples across years while retaining component composition
- Show annual totals split into short-term and long-term portions
data_contract:
  analytical-calculation: forbidden
  summary: Continuous years with two complete samples and two non-negative components per sample-year.
  required_data_roles:
  - field: year
    source: paired-stacked-vbar-sector.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: sample
    source: paired-stacked-vbar-sector.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: sample_order
    source: paired-stacked-vbar-sector.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: component
    source: paired-stacked-vbar-sector.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: component_order
    source: paired-stacked-vbar-sector.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: value
    source: paired-stacked-vbar-sector.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied component value per bar
    mark_to_data_mapping: segment size encodes a component; normalized assets require components to sum to the declared whole
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - vertical-bar
  - stacked
  - paired-within-year
  - annual
  encoding:
  - violet-short-term
  - gray-long-term
  annotation:
  - arrow-direct-labels
  - compact-top-right-legend
  axes:
  - zero-baseline
  - continuous-year-x
  - total-y
  layout:
  - single-panel
  - wide-landscape
implementation:
  entrypoint: render
  hard-checks:
  - unique year sample component keys
  - two components per sample-year
  - non-negative values
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Arrow anchors must be adapted when values or sample names change.
qa:
  deterministic: true
