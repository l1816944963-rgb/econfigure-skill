id: age-year-grayscale-heatmaps-4panel
family: heatmap
subtype: age-year-grayscale-heatmaps-4panel
status: approved
files:
  preview: age-year-grayscale-heatmaps-4panel.png
  script: age-year-grayscale-heatmaps-4panel.py
  fixtures:
  - age-year-grayscale-heatmaps-4panel.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 6000
  - 7002
scene:
- Compare age-by-year surfaces across four components.
elements:
  geometry:
  - four-panel-grayscale-heatmap
  - top-year-axis
  - reversed-age-axis
  - horizontal-colorbars
  - white-cell-gaps
data_contract:
  analytical-calculation: forbidden
  summary: External supplied display coordinates/colors and literal labels; analytical calculations forbidden.
  required_data_roles:
  - field: panel
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: row
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: column
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: age
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: year
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: red
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: visual-channel
    value_type: number-or-string
    required: true
    description: Supplies an explicit color component or palette value.
  - field: green
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: visual-channel
    value_type: number-or-string
    required: true
    description: Supplies an explicit color component or palette value.
  - field: blue
    source: age-year-grayscale-heatmaps-4panel.fixture.csv
    role: visual-channel
    value_type: number-or-string
    required: true
    description: Supplies an explicit color component or palette value.
  semantic_contract:
    unit_of_observation: one supplied value per matrix cell
    mark_to_data_mapping: cell color encodes magnitude at the row-column intersection
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Do not reorder rows or columns unless the ordering rule is supplied or explicitly approved.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
compatibility:
  academic-publication: adaptation-required
  warnings:
  - Separate cell-fill sampling from white grid gaps. Low-resolution JPEG raster readings cannot recover exact numerical intensities.
qa:
  deterministic: true
implementation:
  entrypoint: render
  hard-checks:
  - required columns are present
  - numeric inputs are finite
  - declared structural keys are unique
