id: negative-bar-sector-change
family: bar-comparison
subtype: signed-negative-vertical-bars
status: approved
files:
  preview: negative-bar-sector-change.png
  script: negative-bar-sector-change.py
  fixtures:
  - negative-bar-sector-change.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4194
  - 2472
  additional-master-formats: forbidden
scene:
- Compare signed changes across many sectors
- Emphasize the magnitude of mostly negative category changes
data_contract:
  analytical-calculation: forbidden
  summary: Ordered unique categories with one signed value each and at least one negative value.
  required_data_roles:
  - field: category
    source: negative-bar-sector-change.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: order
    source: negative-bar-sector-change.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: value
    source: negative-bar-sector-change.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied value per category
    mark_to_data_mapping: bar length or height encodes magnitude from a zero baseline
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - vertical-bar
  - single-series
  - many-categories
  encoding:
  - uniform-gray-fill
  annotation:
  - rotated-category-labels
  - zero-line
  axes:
  - signed-y
  - categorical-x
  - horizontal-grid
  layout:
  - wide-bottom-label-margin
implementation:
  entrypoint: render
  hard-checks:
  - unique categories and orders
  - finite values
  - at least one negative value
  - visible zero baseline
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Long category labels require insertion-width review.
qa:
  deterministic: true
