id: transaction-price-value-2x2
family: scatter-relationship
subtype: four-regime-scatter-against-identity
status: approved
files:
  preview: transaction-price-value-2x2.png
  script: transaction-price-value-2x2.py
  fixtures:
  - transaction-price-value-2x2.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4320
  - 4542
  additional-master-formats: forbidden
scene:
- Compare price-value alignment across four market regimes
- Diagnose dispersion and censoring relative to an identity benchmark
data_contract:
  analytical-calculation: forbidden
  summary: Four named panels with non-negative supplied observations and a supplied identity reference path.
  required_data_roles:
  - field: panel
    source: transaction-price-value-2x2.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: kind
    source: transaction-price-value-2x2.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: x
    source: transaction-price-value-2x2.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: y
    source: transaction-price-value-2x2.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one observation or supplied binned point per row
    mark_to_data_mapping: horizontal and vertical position jointly encode a relationship; any fitted path must be explicitly
      authorized or supplied
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Do not fabricate observations or extend a fitted line beyond its supported domain.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - scatter
  - dense-cloud
  - diagonal-reference
  - four-panels
  encoding:
  - semi-transparent-blue-circles
  - thin-blue-identity-line
  annotation:
  - panel-titles
  - shared-axis-labels
  axes:
  - shared-zero-to-75-domain
  - aligned-grid
  layout:
  - two-by-two
  - narrow-panel-gutters
implementation:
  entrypoint: render
  hard-checks:
  - exactly four named panels
  - non-negative finite coordinates
  - supplied identity path
  - aligned axis limits
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Point opacity and size must be adapted when observation counts differ materially.
qa:
  deterministic: true
