id: cumulative-frequency-market-age
family: scatter-relationship
subtype: two-market-cumulative-frequency-profile
status: approved
files:
  preview: cumulative-frequency-market-age.png
  script: cumulative-frequency-market-age.py
  fixtures:
  - cumulative-frequency-market-age.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4823
  - 2868
  additional-master-formats: forbidden
scene:
- Compare how quickly observations accumulate across age
- Identify early distributional separation and later convergence
data_contract:
  analytical-calculation: forbidden
  summary: Continuous ages 1 through 60 with two complete non-decreasing cumulative-frequency series.
  required_data_roles:
  - field: series
    source: cumulative-frequency-market-age.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: age
    source: cumulative-frequency-market-age.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: cumulative_frequency
    source: cumulative-frequency-market-age.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one observation or supplied binned point per row
    mark_to_data_mapping: horizontal and vertical position jointly encode a relationship; any fitted path must be explicitly
      authorized or supplied
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Do not fabricate observations or extend a fitted line beyond its supported domain.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - cumulative-line
  - two-series
  - sixty-ages
  encoding:
  - thin-gray-line
  - thick-black-line
  annotation:
  - compact-inset-legend
  axes:
  - age-x
  - cumulative-frequency-y
  - horizontal-grid
  - full-frame
  layout:
  - single-panel
  - wide-landscape
implementation:
  entrypoint: render
  hard-checks:
  - continuous ages 1 through 60
  - exactly two complete series
  - unique series age keys
  - non-decreasing cumulative values
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Series labels must identify which line weight maps to each market.
qa:
  deterministic: true
