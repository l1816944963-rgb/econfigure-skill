id: employment-shock-binscatter
family: scatter-relationship
subtype: two-group-binscatter-with-direct-labels
status: approved
files:
  preview: employment-shock-binscatter.png
  script: employment-shock-binscatter.py
  fixtures:
  - employment-shock-binscatter.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4800
  - 3132
  additional-master-formats: forbidden
scene:
- Compare heterogeneous relationships across exposed and unexposed groups
- Show group-specific binned trends without a separate legend
data_contract:
  analytical-calculation: forbidden
  summary: Exactly 48 supplied bin means and one supplied two-point fit path for each of two groups.
  required_data_roles:
  - field: series
    source: employment-shock-binscatter.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: kind
    source: employment-shock-binscatter.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: x
    source: employment-shock-binscatter.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: y
    source: employment-shock-binscatter.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one observation or supplied binned point per row
    mark_to_data_mapping: horizontal and vertical position jointly encode a relationship; any fitted path must be explicitly
      authorized or supplied
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Do not fabricate observations or extend a fitted line beyond its supported domain.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - binscatter
  - two-series
  - linear-fit
  encoding:
  - hollow-gray-circles
  - black-diamonds
  - matching-lines
  annotation:
  - direct-series-labels
  - bottom-method-note
  axes:
  - negative-shock-x
  - employed-share-y
  - dotted-grid
  layout:
  - single-panel
  - wide-landscape
implementation:
  entrypoint: render
  hard-checks:
  - exactly two groups
  - exactly 48 bin means per group
  - complete supplied fit paths
  - finite coordinates
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Direct-label positions require adaptation when real data ranges change.
qa:
  deterministic: true
