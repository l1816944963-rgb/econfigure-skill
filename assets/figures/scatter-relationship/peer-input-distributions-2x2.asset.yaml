id: peer-input-distributions-2x2
family: scatter-relationship
subtype: two-histograms-and-two-peer-comparison-panels
status: approved
files:
  preview: peer-input-distributions-2x2.png
  script: peer-input-distributions-2x2.py
  fixtures:
  - peer-input-distributions-2x2.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4560
  - 6000
  additional-master-formats: forbidden
scene:
- Audit peer-variable input distributions
- Compare peer means with peer-range summaries across own-rank positions
data_contract:
  analytical-calculation: forbidden
  summary: Supplied histogram bins and two bounded scatter series for each of two lower panels.
  required_data_roles:
  - field: panel
    source: peer-input-distributions-2x2.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: kind
    source: peer-input-distributions-2x2.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: series
    source: peer-input-distributions-2x2.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: x
    source: peer-input-distributions-2x2.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: y
    source: peer-input-distributions-2x2.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  - field: width
    source: peer-input-distributions-2x2.fixture.csv
    role: geometric-magnitude
    value_type: number
    required: true
    description: Controls a data-encoded width.
  semantic_contract:
    unit_of_observation: one observation or supplied binned point per row
    mark_to_data_mapping: horizontal and vertical position jointly encode a relationship; any fitted path must be explicitly
      authorized or supplied
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Do not fabricate observations or extend a fitted line beyond its supported domain.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - overlaid-histogram
  - single-histogram
  - paired-scatter
  - four-panels
  encoding:
  - transparent-overlap
  - hollow-circle
  - plus-marker
  annotation:
  - panel-titles
  - panel-local-legends
  axes:
  - share-y
  - bounded-zero-to-one-scales
  layout:
  - two-by-two
  - legends-below-selected-panels
implementation:
  entrypoint: render
  hard-checks:
  - exactly four panels
  - non-negative histogram shares
  - bounded scatter values
  - supplied series labels
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Overlapping filled histograms require transparency and color-safe adaptation.
qa:
  deterministic: true
