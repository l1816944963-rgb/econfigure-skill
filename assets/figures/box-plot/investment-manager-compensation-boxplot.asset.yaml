id: investment-manager-compensation-boxplot
family: box-plot
subtype: five-profession-compensation-distributions
status: approved
files:
  preview: investment-manager-compensation-boxplot.png
  script: investment-manager-compensation-boxplot.py
  fixtures:
  - investment-manager-compensation-boxplot.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 6000
  - 2934
  additional-master-formats: forbidden
scene:
- Compare compensation distribution across professions
- Relate quartiles to named external percentiles
data_contract:
  analytical-calculation: forbidden
  summary: Five ordered supplied five-number summaries and three reference values.
  required_data_roles:
  - field: order
    source: investment-manager-compensation-boxplot.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: label
    source: investment-manager-compensation-boxplot.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  - field: low
    source: investment-manager-compensation-boxplot.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: q1
    source: investment-manager-compensation-boxplot.fixture.csv
    role: distribution-summary
    value_type: number
    required: true
    description: Supplies a precomputed distribution summary.
  - field: median
    source: investment-manager-compensation-boxplot.fixture.csv
    role: distribution-summary
    value_type: number
    required: true
    description: Supplies a precomputed distribution summary.
  - field: q3
    source: investment-manager-compensation-boxplot.fixture.csv
    role: distribution-summary
    value_type: number
    required: true
    description: Supplies a precomputed distribution summary.
  - field: high
    source: investment-manager-compensation-boxplot.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  semantic_contract:
    unit_of_observation: raw observations or supplied five-number summaries as declared
    mark_to_data_mapping: box, median, whiskers, and outliers encode distinct distribution summaries
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - horizontal-boxplot
  - whiskers
  - median
  - percentile-guides
  encoding:
  - blue-gray-box
  - orange-dashed-guides
  annotation:
  - rotated-percentile-labels
  - source-note
  axes:
  - compensation-x
  - profession-y
  layout:
  - single-wide-panel
implementation:
  entrypoint: render
  hard-checks:
  - ordered-five-number-summaries
  - supplied-reference-values
compatibility:
  grayscale: preview-generated; semantic color mapping still requires review
  academic-publication: conditional
  warnings:
  - Whisker convention must be supplied for empirical use.
qa:
  deterministic: true
