id: values-financial-promotion-forest
family: coefficient-plot
subtype: paired-horizontal-intervals
status: approved
files:
  preview: values-financial-promotion-forest.png
  script: values-financial-promotion-forest.py
  fixtures:
  - values-financial-promotion-forest.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 6000
  - 4620
scene:
- Compare two supplied effects across value domains.
data_contract:
  analytical-calculation: forbidden
  summary: External plotting fixture; no analytical calculation.
  required_data_roles:
  - field: order
    source: values-financial-promotion-forest.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: label
    source: values-financial-promotion-forest.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  - field: series
    source: values-financial-promotion-forest.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: estimate
    source: values-financial-promotion-forest.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: low
    source: values-financial-promotion-forest.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: high
    source: values-financial-promotion-forest.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  semantic_contract:
    unit_of_observation: one supplied point estimate and interval per coefficient key
    mark_to_data_mapping: point position encodes the estimate and whiskers encode supplied lower and upper limits
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - horizontal-interval
  - paired-diamonds
  - filled-hollow-markers
  - row-separators
  - red-zero-reference
  encoding:
  - blue-financial
  - red-promotion
implementation:
  entrypoint: render
  shared-module: chartlib.inference_renderers
  tick-policy:
    x: centered
    y: none
compatibility:
  warnings:
  - Keep series offsets, interval weight and legend marker size independent; large category text needs a reserved left band.
  grayscale: preview-generated; review color-dependent distinctions before grayscale use
qa:
  deterministic: true
