id: treatment-arm-domain-intervals
family: coefficient-plot
subtype: three-facet-paired-intervals
status: approved
files:
  preview: treatment-arm-domain-intervals.png
  script: treatment-arm-domain-intervals.py
  fixtures:
  - treatment-arm-domain-intervals.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 6000
  - 3828
scene:
- Compare short- and later-term domain effects across three treatment arms.
data_contract:
  analytical-calculation: forbidden
  summary: External plotting fixture; no analytical calculation.
  required_data_roles:
  - field: panel
    source: treatment-arm-domain-intervals.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: order
    source: treatment-arm-domain-intervals.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: label
    source: treatment-arm-domain-intervals.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  - field: series
    source: treatment-arm-domain-intervals.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: estimate
    source: treatment-arm-domain-intervals.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: low
    source: treatment-arm-domain-intervals.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: high
    source: treatment-arm-domain-intervals.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  - field: display
    source: treatment-arm-domain-intervals.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  semantic_contract:
    unit_of_observation: one supplied point estimate and interval per coefficient key
    mark_to_data_mapping: point position encodes the estimate and whiskers encode supplied lower and upper limits
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - paired-horizontal-interval
  - three-facets
  - literal-p-labels
  - shared-domain-rows
  encoding:
  - green-short-term
  - blue-later-term
implementation:
  entrypoint: render
  shared-module: chartlib.inference_renderers
  tick-policy:
    x: centered
    y: none
compatibility:
  warnings:
  - Reserve independent bands for facet axis labels, legend and global title; paired p-value definitions must be supplied
    by the caller.
  grayscale: preview-generated; review color-dependent distinctions before grayscale use
qa:
  deterministic: true
