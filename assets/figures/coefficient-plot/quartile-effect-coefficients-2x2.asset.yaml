id: quartile-effect-coefficients-2x2
family: coefficient-plot
subtype: quartile-effect-four-panel-comparison
status: approved
files:
  preview: quartile-effect-coefficients-2x2.png
  script: quartile-effect-coefficients-2x2.py
  fixtures:
  - quartile-effect-coefficients-2x2.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4800
  - 6660
  additional-master-formats: forbidden
scene:
- Compare heterogeneous effects across ordered quartiles
- Contrast efficacy and representation outcomes
data_contract:
  analytical-calculation: forbidden
  summary: Four panels with four ordered estimate lower upper summaries each.
  required_data_roles:
  - field: panel
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: title
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  - field: quartile
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: estimate
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: low
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: high
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  - field: color
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: visual-channel
    value_type: number-or-string
    required: true
    description: Supplies an explicit color component or palette value.
  - field: fit
    source: quartile-effect-coefficients-2x2.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: one supplied point estimate and interval per coefficient key
    mark_to_data_mapping: point position encodes the estimate and whiskers encode supplied lower and upper limits
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - point-interval
  - four-panels
  - supplied-reference-path
  encoding:
  - blue-diamond
  - green-circle
  - red-zero-line
  annotation:
  - panel-caption
  axes:
  - quartile-x
  - effect-y
  layout:
  - two-by-two
implementation:
  entrypoint: render
  hard-checks:
  - four-panels
  - four-quartiles-per-panel
  - ordered-intervals
compatibility:
  grayscale: preview-generated; semantic color mapping still requires review
  academic-publication: conditional
  warnings:
  - The connecting path is descriptive and must not be treated as a fitted curve.
qa:
  deterministic: true
