id: mental-health-study-comparison
family: coefficient-plot
subtype: study-point-intervals
status: approved
files:
  preview: mental-health-study-comparison.png
  script: mental-health-study-comparison.py
  fixtures:
  - mental-health-study-comparison.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4440
  - 3012
scene:
- Compare study-level mental-health effect summaries and exposure durations.
data_contract:
  analytical-calculation: forbidden
  summary: External plotting fixture; no analytical calculation.
  required_data_roles:
  - field: order
    source: mental-health-study-comparison.fixture.csv
    role: ordering-key
    value_type: integer
    required: true
    description: Controls stable display order; it does not encode magnitude.
  - field: label
    source: mental-health-study-comparison.fixture.csv
    role: display-label
    value_type: string
    required: true
    description: Supplies visible text without changing the analytical value.
  - field: duration
    source: mental-health-study-comparison.fixture.csv
    role: ordered-domain
    value_type: number-or-date
    required: true
    description: Defines an ordered temporal or sequential domain.
  - field: estimate
    source: mental-health-study-comparison.fixture.csv
    role: point-estimate
    value_type: number
    required: true
    description: Supplies a point estimate or effect center.
  - field: low
    source: mental-health-study-comparison.fixture.csv
    role: interval-lower
    value_type: number
    required: true
    description: Supplies a lower interval boundary; the renderer must not infer it.
  - field: high
    source: mental-health-study-comparison.fixture.csv
    role: interval-upper
    value_type: number
    required: true
    description: Supplies an upper interval boundary; the renderer must not infer it.
  semantic_contract:
    unit_of_observation: one supplied point estimate and interval per coefficient key
    mark_to_data_mapping: point position encodes the estimate and whiskers encode supplied lower and upper limits
    specialized: true
    rules:
    - Do not change analytical definitions or calculate missing research results.
    - Estimate and every displayed interval boundary must be supplied on identical keys.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - vertical-point-interval
  - diamond-marker
  - value-label
  - two-level-study-label
  encoding:
  - black-marker
  - gray-interval
implementation:
  entrypoint: render
  shared-module: chartlib.inference_renderers
  tick-policy:
    x: none
    y: none
compatibility:
  warnings:
  - Use a separate duration label band; do not calculate or infer study comparability from a plot.
  grayscale: preview-generated; review color-dependent distinctions before grayscale use
qa:
  deterministic: true
