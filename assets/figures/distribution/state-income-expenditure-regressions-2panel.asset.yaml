id: state-income-expenditure-regressions-2panel
family: distribution
subtype: state-level-fixed-effect-regressions
status: approved
files:
  preview: state-income-expenditure-regressions-2panel.png
  script: state-income-expenditure-regressions-2panel.py
  fixtures:
  - state-income-expenditure-regressions-2panel.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 3042
  - 4266
  additional-master-formats: forbidden
scene:
- Compare state-level visible and housing expenditure relationships
- Preserve state identities around fitted trends
data_contract:
  analytical-calculation: forbidden
  summary: Two panels with at least thirty labeled state observations and exactly two supplied fit endpoints each.
  required_data_roles:
  - field: panel
    source: state-income-expenditure-regressions-2panel.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: state
    source: state-income-expenditure-regressions-2panel.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  - field: income
    source: state-income-expenditure-regressions-2panel.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  - field: expenditure
    source: state-income-expenditure-regressions-2panel.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  - field: kind
    source: state-income-expenditure-regressions-2panel.fixture.csv
    role: category-key
    value_type: string
    required: true
    description: Defines a grouping, series, component, or categorical position.
  semantic_contract:
    unit_of_observation: raw observations or supplied density/frequency values as declared by the fixture
    mark_to_data_mapping: position and density, frequency, or probability encode distribution shape
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - scatter
  - supplied-linear-fit
  - two-panel
  encoding:
  - blue-points
  - red-fit
  annotation:
  - state-labels
  - figure-titles
  - model-note
  axes:
  - income-x
  - expenditure-y
  - panel-specific-y
  layout:
  - two-rows
  - portrait
implementation:
  entrypoint: render
  hard-checks:
  - exactly two panels
  - at least thirty points per panel
  - two fit endpoints per panel
  - fit paths span the visible x domain
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - State labels and model notes require source-size collision review.
qa:
  deterministic: true
