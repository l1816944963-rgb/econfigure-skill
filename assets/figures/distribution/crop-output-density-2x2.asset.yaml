id: crop-output-density-2x2
family: distribution
subtype: four-outcome-density-panels
status: approved
files:
  preview: crop-output-density-2x2.png
  script: crop-output-density-2x2.py
  fixtures:
  - crop-output-density-2x2.fixture.csv
output:
  format: png
  dpi: 600
  pixel-size:
  - 4572
  - 2856
  additional-master-formats: forbidden
scene:
- Compare transformed outcome distributions across crop definitions
- Inspect mass around a zero reference
data_contract:
  analytical-calculation: forbidden
  summary: Four non-negative supplied density series with at least fifty ordered x positions each.
  required_data_roles:
  - field: panel
    source: crop-output-density-2x2.fixture.csv
    role: facet-key
    value_type: string
    required: true
    description: Assigns observations or summaries to a panel or section.
  - field: x
    source: crop-output-density-2x2.fixture.csv
    role: quantitative-domain
    value_type: number
    required: true
    description: Defines the quantitative horizontal or ordered position.
  - field: density
    source: crop-output-density-2x2.fixture.csv
    role: measure
    value_type: number
    required: true
    description: Supplies a plotted magnitude; the renderer may transform only for display.
  semantic_contract:
    unit_of_observation: raw observations or supplied density/frequency values as declared by the fixture
    mark_to_data_mapping: position and density, frequency, or probability encode distribution shape
    specialized: false
    rules:
    - Do not change analytical definitions or calculate missing research results.
  retrieval_contract:
    match_first:
    - communication goal
    - required data roles
    - semantic marks
    - panel structure
    match_second:
    - axis behavior
    - encoding
    - annotation
    - layout
    reject_if:
    - required roles are absent
    - the visual mark would change the data meaning
    - the asset hard checks cannot pass
elements:
  geometry:
  - histogram-bars
  - density-outline
  - two-by-two-panels
  encoding:
  - gray-fill
  - dark-outline
  annotation:
  - panel-titles
  - zero-reference
  axes:
  - shared-density-y
  - symmetric-x
  layout:
  - two-by-two
  - compact-landscape
implementation:
  entrypoint: render
  hard-checks:
  - exactly four panels
  - non-negative densities
  - at least fifty points per panel
compatibility:
  grayscale: pass
  academic-publication: conditional
  warnings:
  - Bars must remain visibly discrete after downscaling.
qa:
  deterministic: true
