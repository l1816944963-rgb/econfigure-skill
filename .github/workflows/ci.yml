name: Econfigure Skill CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLCONFIGDIR: ${{ runner.temp }}/econfigure-matplotlib
      ECONFIGURE_TEST_OUTPUT: ${{ runner.temp }}/econfigure-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_catalog.py --check
      - run: python scripts/generate_atlas.py --check
      - run: python scripts/eval_runner.py
      - run: python tests/smoke_test.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/render_standard_samples.py --output-dir "${{ runner.temp }}/econfigure-samples"
      - run: python scripts/eval_runner.py --execute --timeout 180
      - run: python scripts/release_check.py
